name: build-and-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Ensure Rust MSVC toolchain
        shell: pwsh
        run: |
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: Build
        shell: pwsh
        run: .\build.ps1

      - name: Test (all four injection scenarios)
        shell: pwsh
        run: .\test.ps1
